<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">AtomicNav architecture</title>
  <desc id="desc">A route instruction and RGB history are sent to a VLM planner, which emits an atomic subgoal for an RGB executor. The executor returns actions and a local stop; the reached state is sent back to the planner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <text x="64" y="68" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">AtomicNav</text>
  <text x="64" y="98" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569">Semantic planning with a reusable RGB navigation executor</text>

  <g filter="url(#shadow)">
    <rect x="66" y="154" width="230" height="140" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="366" y="134" width="250" height="180" rx="18" fill="#0f172a"/>
    <rect x="686" y="154" width="250" height="140" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="1006" y="134" width="208" height="180" rx="18" fill="#eef2ff" stroke="#818cf8"/>
  </g>

  <text x="181" y="196" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Inputs</text>
  <text x="181" y="227" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Route instruction</text>
  <text x="181" y="252" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">RGB observation</text>
  <text x="181" y="277" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Causal task memory</text>

  <text x="491" y="192" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">General VLM planner</text>
  <text x="491" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#cbd5e1">Select the next atomic subgoal</text>
  <text x="491" y="261" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#a5b4fc">move + observable STOP condition</text>

  <text x="811" y="196" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">RGB executor</text>
  <text x="811" y="227" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Local action loop</text>
  <text x="811" y="252" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Owns local stopping</text>
  <text x="811" y="277" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Returns actions + STOP</text>

  <text x="1110" y="192" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#3730a3">State handoff</text>
  <text x="1110" y="225" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4338ca">Reached pose</text>
  <text x="1110" y="250" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4338ca">Stopping evidence</text>
  <text x="1110" y="275" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#4338ca">Next subgoal</text>

  <path d="M296 224 H356" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M616 224 H676" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M936 224 H996" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1110 330 C1110 375 490 375 490 324" fill="none" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="395" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#4f46e5">preserve physical state; re-plan causally</text>
</svg>
